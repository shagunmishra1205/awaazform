<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><title>AwaazForm: allow microphone</title><link rel="stylesheet" href="sidepanel.css" /></head>
<body style="display:grid;place-items:center;padding:24px">
  <main style="max-width:420px;display:grid;gap:12px;text-align:center">
    <h1 style="margin:0;font-size:22px">Allow the microphone</h1>
    <p>Side panels can’t ask for the microphone themselves. Press the button and choose <b>Allow</b>; then close this tab and use voice in the AwaazForm panel.</p>
    <button id="go" type="button">Allow microphone</button>
    <p id="out" role="status"></p>
  </main>
  <script src="permission.js"></script>
</body>
</html>
