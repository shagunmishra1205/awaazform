<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AwaazForm</title>
  <link rel="stylesheet" href="widget.css" />
</head>
<body>
  <div id="app" class="app" data-open="false" data-transcript="false">
    <aside id="transcript" class="transcript" hidden aria-labelledby="tr-h">
      <header class="tr-head">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v11H8l-4 4z"/></svg>
        <h2 id="tr-h" data-t="widget.transcript"></h2>
        <button id="tr-copy" type="button" class="chip-btn" data-t="widget.copy"></button>
        <button id="tr-close" type="button" class="icon-btn" data-label="widget.hide_transcript">✕</button>
      </header>
      <ol id="tr-list" class="tr-list" aria-live="polite"></ol>
    </aside>

    <section id="panel" class="panel" hidden aria-labelledby="form-title">
      <header class="head">
        <span id="avatar" class="avatar" aria-hidden="true"></span>
        <label class="lang"><span class="sr-only" data-t="widget.language"></span><select id="lang"></select></label>
        <span class="grow"></span>
        <span id="timer" class="timer" role="timer" data-label="widget.timer">00:00</span>
        <button id="mute" type="button" class="icon-btn" aria-pressed="false" data-label="widget.mute">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/><path id="mute-slash" d="M3 3l18 18" opacity="0"/></svg>
        </button>
        <button id="gear" type="button" class="icon-btn" aria-expanded="false" aria-controls="settings" data-label="widget.settings">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </header>
      <p id="form-title" class="form-title"></p>

      <div id="settings" class="settings" hidden>
        <label class="field"><span data-t="widget.server"></span><input id="server" type="url" spellcheck="false" dir="ltr" /></label>
        <div class="row">
          <button id="server-save" type="button" class="btn small" data-t="widget.save"></button>
          <button id="mic-allow" type="button" class="btn small ghost" data-t="widget.allow_mic"></button>
          <button id="rescan" type="button" class="btn small ghost" data-t="widget.read_again"></button>
        </div>
      </div>

      <div class="stage">
        <div id="orb" class="orb" data-state="idle" data-label="live.interrupt"><span id="bolu" class="bolu"></span></div>
        <p id="status" class="status" aria-live="polite"></p>
      </div>

      <div id="card" class="card" aria-live="polite">
        <p id="q-meta" class="q-meta"></p>
        <p id="q-label" class="q-label"></p>
        <div id="opts" class="opts" role="group"></div>
        <div id="readback" class="readback" hidden>
          <p id="rb-value" class="rb-value"></p>
          <div class="row">
            <button id="yes" type="button" class="btn yes"></button>
            <button id="change" type="button" class="btn ghost" data-t="widget.change"></button>
          </div>
        </div>
        <p id="note" class="note"></p>
      </div>

      <form id="typer" class="typer" hidden>
        <label class="sr-only" for="type-in" data-t="widget.type_placeholder"></label>
        <input id="type-in" autocomplete="off" maxlength="2000" />
        <button type="submit" class="btn small" data-t="widget.send"></button>
      </form>

      <footer class="actions">
        <button id="talk" type="button" class="btn talk"></button>
        <button id="tr-toggle" type="button" class="btn ghost" aria-expanded="false" aria-controls="transcript">
          <span data-t="widget.transcript"></span> <span id="tr-count" class="count" hidden>0</span>
        </button>
        <button id="kbd" type="button" class="icon-btn square" aria-expanded="false" aria-controls="typer" data-label="widget.type">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>
        </button>
      </footer>
      <p class="fine" data-t="widget.never_submit"></p>
    </section>

    <button id="fab" type="button" class="fab" aria-expanded="false" aria-controls="panel" data-label="widget.open">
      <span id="fab-bolu" class="fab-bolu" aria-hidden="true"></span>
      <span class="fab-x" aria-hidden="true">✕</span>
    </button>
  </div>
  <script src="widget.js"></script>
</body>
</html>
